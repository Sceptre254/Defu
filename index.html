<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pro PDF Editor · delete pages · mobile</title>

<!-- PDF.js (rendering) + PDF-lib (modify) + Fabric.js (annotations) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0a0a0c;
  --surface: #111116;
  --panel: #16161d;
  --border: #252530;
  --accent: #e8ff47;
  --text: #f0f0f5;
  --muted: #6b6b80;
  --danger: #ff4757;
  --toolbar-h: 60px;
  --sidebar-w: 220px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  height: 100vh; overflow: hidden; background: var(--bg); 
  color: var(--text); font-family: 'Syne', sans-serif; 
}

#app { display: flex; flex-direction: column; height: 100%; }

/* header */
#header {
  height: var(--toolbar-h); background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 15px; gap: 15px; z-index: 100;
}
.logo { font-size: 18px; font-weight: 800; color: var(--accent); white-space: nowrap; }
.logo span { color: #fff; }

.btn {
  padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px;
  transition: 0.2s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #000; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-danger { background: rgba(255,71,87,0.1); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); }
.btn:disabled { opacity: 0.3; pointer-events: none; }

#workspace { display: flex; flex: 1; overflow: hidden; }

/* thumbnails sidebar */
#sidebar {
  width: var(--sidebar-w); background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
#thumb-container {
  flex: 1; overflow-y: auto; padding: 15px;
  display: flex; flex-direction: column; gap: 12px;
}
.thumb-wrapper {
  position: relative; border: 2px solid var(--border);
  border-radius: 6px; cursor: pointer; background: #000;
  transition: 0.2s; overflow: hidden;
}
.thumb-wrapper.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(232,255,71,0.2); }
.thumb-wrapper canvas { width: 100% !important; height: auto !important; display: block; }
.thumb-label {
  position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.7);
  color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 3px;
}

/* main editor area */
#editor-area { flex: 1; display: flex; flex-direction: column; background: #0e0e12; }

#tools {
  height: 50px; background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 15px; gap: 8px; overflow-x: auto;
}
.tool-btn {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--muted); cursor: pointer; border-radius: 6px;
}
.tool-btn.active { background: rgba(232,255,71,0.1); color: var(--accent); }
.tool-btn:hover:not(.active) { background: var(--border); }

#canvas-outer {
  flex: 1; overflow: auto; display: flex; justify-content: center; padding: 40px;
  scroll-behavior: smooth;
}
#canvas-viewport { position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
#fabric-canvas-container { position: absolute; top: 0; left: 0; }

/* mobile adaptation */
@media (max-width: 768px) {
  #workspace { flex-direction: column; }
  #sidebar { 
    width: 100%; height: 120px; border-right: none; border-bottom: 1px solid var(--border);
  }
  #thumb-container { flex-direction: row; }
  .thumb-wrapper { width: 80px; flex-shrink: 0; }
  #canvas-outer { padding: 10px; }
  .btn span { display: none; }
}

#welcome-screen {
  position: absolute; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200; text-align: center; padding: 20px;
}
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  padding: 10px 20px; border-radius: 8px; background: var(--panel);
  border: 1px solid var(--border); font-size: 13px; display: none; z-index: 1000;
}
</style>
</head>
<body>

<div id="app">
  <header id="header">
    <div class="logo">PDF<span>PRO</span></div>
    <button class="btn btn-primary" onclick="triggerFile()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Open File</span>
    </button>
    <button class="btn btn-ghost" id="dl-btn" onclick="exportPDF()" disabled>
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Download</span>
    </button>
    <div style="flex:1"></div>
    <button class="btn btn-danger" id="del-pg-btn" onclick="deleteCurrentPage()" disabled>
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      <span>Delete Page</span>
    </button>
  </header>

  <div id="workspace">
    <aside id="sidebar">
      <div id="thumb-container"></div>
    </aside>

    <main id="editor-area">
      <div id="tools">
        <button class="tool-btn active" id="t-select" onclick="setTool('select')" title="Select & Move (V)"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 3l14 9-7 1-3 7z"/></svg></button>
        <button class="tool-btn" id="t-redact" onclick="setTool('redact')" title="Black Box (B)"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/></svg></button>
        <button class="tool-btn" id="t-white" onclick="setTool('white')" title="White Box (W)"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/></svg></button>
        <button class="tool-btn" id="t-text" onclick="setTool('text')" title="Add Text (T)"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg></button>
        <div style="width:1px; height:24px; background:var(--border); margin:0 5px;"></div>
        <button class="tool-btn" onclick="copyObj()" title="Copy (Ctrl+C)"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        <button class="tool-btn" onclick="pasteObj()" title="Paste (Ctrl+V)"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg></button>
      </div>

      <div id="canvas-outer">
        <div id="canvas-viewport" style="display:none">
          <canvas id="pdf-render-canvas"></canvas>
          <div id="fabric-canvas-container">
            <canvas id="f-canvas"></canvas>
          </div>
        </div>
        
        <div id="welcome-screen">
          <h1 style="margin-bottom:10px">Quick PDF <span>Editor</span></h1>
          <p style="color:var(--muted); margin-bottom:20px">No uploads. Fast editing. Mobile responsive.</p>
          <button class="btn btn-primary" style="padding:15px 30px" onclick="triggerFile()">Get Started</button>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="file-input" accept="application/pdf" style="display:none" onchange="handleFile(this)">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;               // PDF.js document
let pdfBytes = null;             // original/edited bytes (Uint8Array)
let fCanvas = null;              // fabric canvas instance
let currentPage = 1, totalPages = 0, scale = 1.5;
let pageEdits = {};              // stores fabric JSON per page
let clipboard = null;
let activeTool = 'select';

// Helper toasts
function msg(text, bg = '#47ffb0', color = '#000') {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.style.background = bg;
  toast.style.color = color;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2500);
}

function triggerFile() { document.getElementById('file-input').click(); }

// File selected: read as bytes
async function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const buffer = await file.arrayBuffer();
    pdfBytes = new Uint8Array(buffer);
    await initEditor();
  } catch (e) {
    msg('Error reading file', '#ff4757', '#fff');
  }
}

// Initialise PDF.js, reset edits, load first page
async function initEditor() {
  try {
    msg('Loading PDF...', '#333', '#e8ff47');
    pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
    totalPages = pdfDoc.numPages;
    
    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('canvas-viewport').style.display = 'block';
    document.getElementById('dl-btn').disabled = false;
    document.getElementById('del-pg-btn').disabled = false;

    pageEdits = {};        // fresh start
    await refreshThumbnails();
    await loadPage(1);
    msg(`✅ Ready — ${totalPages} pages`, '#1e1e2f', '#e8ff47');
  } catch(e) {
    msg('❌ Corrupt PDF', '#ff4757', '#fff');
  }
}

// Render thumbnails (scale 0.2)
async function refreshThumbnails() {
  const container = document.getElementById('thumb-container');
  container.innerHTML = '';
  for (let i = 1; i <= totalPages; i++) {
    const wrapper = document.createElement('div');
    wrapper.className = `thumb-wrapper ${i === currentPage ? 'active' : ''}`;
    wrapper.onclick = () => loadPage(i);
    
    const canvas = document.createElement('canvas');
    const page = await pdfDoc.getPage(i);
    const vp = page.getViewport({ scale: 0.2 });
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    
    const label = document.createElement('div');
    label.className = 'thumb-label'; label.textContent = i;
    
    wrapper.append(canvas, label);
    container.appendChild(wrapper);
  }
}

// Load specific page into fabric + pdf canvas
async function loadPage(num) {
  // save current edits before switching
  if (fCanvas) pageEdits[currentPage] = fCanvas.toJSON();

  currentPage = num;
  const page = await pdfDoc.getPage(num);
  const vp = page.getViewport({ scale });

  // render background PDF
  const pdfCanv = document.getElementById('pdf-render-canvas');
  pdfCanv.width = vp.width; pdfCanv.height = vp.height;
  await page.render({ canvasContext: pdfCanv.getContext('2d'), viewport: vp }).promise;

  // resize viewport container
  const view = document.getElementById('canvas-viewport');
  view.style.width = vp.width + 'px';
  view.style.height = vp.height + 'px';

  // (re)create fabric canvas
  if (fCanvas) fCanvas.dispose();
  fCanvas = new fabric.Canvas('f-canvas', {
    width: vp.width,
    height: vp.height,
    selection: true,
    preserveObjectStacking: true
  });

  // restore any edits for this page
  if (pageEdits[num]) {
    fCanvas.loadFromJSON(pageEdits[num], () => {
      fCanvas.renderAll();
      setTool(activeTool); // reapply cursor
    });
  } else {
    setTool(activeTool);
  }

  initFabricEvents();

  // update active thumbnail highlight
  document.querySelectorAll('.thumb-wrapper').forEach((t, idx) => {
    t.classList.toggle('active', idx + 1 === num);
  });
}

// ----- TOOLS (redact/white/text) -----
function setTool(t) {
  activeTool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('t-' + t);
  if (btn) btn.classList.add('active');
  if (!fCanvas) return;
  fCanvas.selection = (t === 'select');
  fCanvas.defaultCursor = (t === 'select') ? 'default' : 'crosshair';
  fCanvas.discardActiveObject().renderAll();
}

// Fabric event handlers for drawing rectangles / adding text
function initFabricEvents() {
  let isDown = false, startX, startY, activeRect;

  fCanvas.off('mouse:down');
  fCanvas.off('mouse:move');
  fCanvas.off('mouse:up');

  fCanvas.on('mouse:down', (opt) => {
    if (activeTool === 'select') return;
    const pointer = fCanvas.getPointer(opt.e);
    startX = pointer.x; startY = pointer.y;

    if (activeTool === 'redact' || activeTool === 'white') {
      isDown = true;
      activeRect = new fabric.Rect({
        left: startX, top: startY, width: 0, height: 0,
        fill: activeTool === 'redact' ? 'black' : 'white',
        strokeWidth: 0,
        selectable: true,
        hasControls: true,
        hasBorders: true
      });
      fCanvas.add(activeRect);
      fCanvas.renderAll();
    } else if (activeTool === 'text') {
      const txt = prompt('Enter text:');
      if (txt && txt.trim()) {
        const textObj = new fabric.IText(txt, {
          left: startX, top: startY,
          fontSize: 24,
          fill: '#e8ff47',
          fontFamily: 'Syne, sans-serif'
        });
        fCanvas.add(textObj);
        fCanvas.setActiveObject(textObj);
      }
      setTool('select');  // go back to select after adding text
    }
  });

  fCanvas.on('mouse:move', (opt) => {
    if (!isDown || !activeRect) return;
    const pointer = fCanvas.getPointer(opt.e);
    const width = Math.abs(pointer.x - startX);
    const height = Math.abs(pointer.y - startY);
    activeRect.set({
      width: width,
      height: height,
      left: Math.min(pointer.x, startX),
      top: Math.min(pointer.y, startY)
    });
    fCanvas.renderAll();
  });

  fCanvas.on('mouse:up', () => {
    if (isDown && activeRect) {
      // if rectangle is tiny, remove it (accidental click)
      if (activeRect.width < 5 || activeRect.height < 5) {
        fCanvas.remove(activeRect);
      }
      isDown = false;
      activeRect = null;
      setTool('select'); // auto switch to select after drawing
    }
  });
}

// ----- DELETE PAGE (core fix) -----
async function deleteCurrentPage() {
  if (!pdfDoc || totalPages <= 1) {
    return msg('Cannot delete the only page', '#ff4757', '#fff');
  }
  if (!confirm(`Delete page ${currentPage}?`)) return;

  try {
    // 1. Use PDF-lib to remove page
    const { PDFDocument } = PDFLib;
    const doc = await PDFDocument.load(pdfBytes);
    doc.removePage(currentPage - 1);          // zero‑based index
    const newBytes = await doc.save();        // Uint8Array

    // 2. Update pdfBytes and reload pdf.js document
    pdfBytes = newBytes;
    pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
    const oldTotal = totalPages;
    totalPages = pdfDoc.numPages;

    // 3. Shift pageEdits (remove current page, renumber higher pages)
    const newEdits = {};
    for (let p in pageEdits) {
      const pg = parseInt(p);
      if (pg < currentPage) newEdits[pg] = pageEdits[pg];
      else if (pg > currentPage) newEdits[pg - 1] = pageEdits[pg];
    }
    pageEdits = newEdits;

    // 4. Adjust currentPage if beyond new total
    let targetPage = currentPage;
    if (targetPage > totalPages) targetPage = totalPages;

    // 5. Regenerate thumbnails and load target page
    await refreshThumbnails();
    await loadPage(targetPage);

    msg(`Page ${currentPage} deleted. Now ${totalPages} pages.`, '#1e1e2f', '#e8ff47');
  } catch (err) {
    console.error(err);
    msg('Delete failed', '#ff4757', '#fff');
  }
}

// ----- clipboard -----
function copyObj() {
  const active = fCanvas.getActiveObject();
  if (!active) return msg('No object selected', '#666');
  active.clone((cloned) => {
    clipboard = cloned;
    msg('Copied');
  });
}

function pasteObj() {
  if (!clipboard) return msg('Nothing copied', '#666');
  clipboard.clone((cloned) => {
    fCanvas.discardActiveObject();
    cloned.set({
      left: cloned.left + 20,
      top: cloned.top + 20,
      evented: true,
    });
    if (cloned.type === 'activeSelection') cloned.canvas = fCanvas;
    fCanvas.add(cloned);
    fCanvas.setActiveObject(cloned);
    fCanvas.requestRenderAll();
  });
}

// ----- EXPORT with annotations (rectangles and text) -----
async function exportPDF() {
  // save current page edits
  if (fCanvas) pageEdits[currentPage] = fCanvas.toJSON();

  msg('🔄 applying edits...', '#222', '#e8ff47');
  try {
    const { PDFDocument, rgb, grayscale } = PDFLib;
    const doc = await PDFDocument.load(pdfBytes);
    const pages = doc.getPages();

    for (let i = 0; i < pages.length; i++) {
      const pageNum = i + 1;
      const edits = pageEdits[pageNum];
      if (!edits || !edits.objects || edits.objects.length === 0) continue;

      const page = pages[i];
      const { width, height } = page.getSize();

      // we need original PDF.js page to compute viewport ratio
      const pjsPage = await pdfDoc.getPage(pageNum);
      const vp = pjsPage.getViewport({ scale });
      const scaleX = width / vp.width;
      const scaleY = height / vp.height;

      for (const obj of edits.objects) {
        // fabric rectangles (redact or white)
        if (obj.type === 'rect') {
          const x = obj.left * scaleX;
          const y = height - (obj.top + (obj.height * (obj.scaleY || 1))) * scaleY;
          const rectWidth = obj.width * (obj.scaleX || 1) * scaleX;
          const rectHeight = obj.height * (obj.scaleY || 1) * scaleY;

          const fillColor = (obj.fill === 'black' || obj.fill === '#000000') ? grayscale(0) : grayscale(1);
          page.drawRectangle({
            x, y,
            width: rectWidth,
            height: rectHeight,
            color: fillColor,
          });
        }
        // i-text objects
        else if (obj.type === 'i-text' || obj.type === 'text') {
          const fontSize = (obj.fontSize || 20) * scaleY;
          const textX = obj.left * scaleX;
          const textY = height - (obj.top * scaleY) - fontSize * 0.8; // adjust baseline
          page.drawText(obj.text || '', {
            x: textX,
            y: textY,
            size: fontSize,
            color: rgb(0.9, 1.0, 0.2), // yellowish
            font: await doc.embedFont(PDFLib.StandardFonts.Helvetica)
          });
        }
      }
    }

    const finalPdf = await doc.save();
    const blob = new Blob([finalPdf], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'edited_document.pdf';
    link.click();
    URL.revokeObjectURL(url);
    msg('✅ Download ready', '#47ffb0', '#000');
  } catch (e) {
    console.error(e);
    msg('Export failed', '#ff4757', '#fff');
  }
}

// ----- keyboard shortcuts -----
window.addEventListener('keydown', (e) => {
  if (!fCanvas) return;
  if (e.ctrlKey && e.key === 'c') {
    e.preventDefault();
    copyObj();
  } else if (e.ctrlKey && e.key === 'v') {
    e.preventDefault();
    pasteObj();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    const active = fCanvas.getActiveObjects();
    if (active.length) {
      active.forEach(obj => fCanvas.remove(obj));
      fCanvas.discardActiveObject().renderAll();
      e.preventDefault();
    }
  }
});

// patch for touch devices: ensure canvas reacts
window.addEventListener('load', () => {
  // ensure file input works on mobile
});
</script>
</body>
</html>
