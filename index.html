<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pro PDF Editor — Local & Fast</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0a0a0c;
  --surface: #111116;
  --panel: #16161d;
  --border: #252530;
  --accent: #e8ff47;
  --text: #f0f0f5;
  --muted: #6b6b80;
  --danger: #ff4757;
  --toolbar-h: 65px;
  --sidebar-w: 240px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; }

#app { display: flex; flex-direction: column; height: 100%; }

#header {
  height: var(--toolbar-h); background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 15px; gap: 12px; z-index: 100;
}

.logo { font-size: 18px; font-weight: 800; color: var(--accent); }
.logo span { color: #fff; }

.btn {
  padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: 0.2s;
}
.btn-primary { background: var(--accent); color: #000; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-danger { background: rgba(255,71,87,0.1); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); }
.btn:disabled { opacity: 0.3; pointer-events: none; }

#workspace { display: flex; flex: 1; overflow: hidden; }

#sidebar {
  width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
#thumb-container {
  flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px;
}
.thumb-wrapper {
  position: relative; border: 2px solid var(--border); border-radius: 6px;
  cursor: pointer; background: #000; transition: 0.2s; overflow: hidden;
}
.thumb-wrapper.active { border-color: var(--accent); }
.thumb-wrapper canvas { width: 100% !important; height: auto !important; display: block; }
.thumb-label {
  position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.7);
  color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 3px;
}

#editor-area { flex: 1; display: flex; flex-direction: column; background: #0e0e12; position: relative; }

#tools {
  height: 50px; background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 15px; gap: 8px; overflow-x: auto;
}
.tool-btn {
  height: 34px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 6px;
  background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer; border-radius: 6px; font-size: 12px; font-weight: 600;
}
.tool-btn.active { background: rgba(232,255,71,0.1); color: var(--accent); border-color: rgba(232,255,71,0.2); }
.tool-btn:hover:not(.active) { background: var(--border); }

#canvas-outer { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 40px; }
#canvas-viewport { position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); background: white; }
#fabric-canvas-container { position: absolute; top: 0; left: 0; pointer-events: all; }

@media (max-width: 768px) {
  #workspace { flex-direction: column; }
  #sidebar { width: 100%; height: 130px; border-right: none; border-bottom: 1px solid var(--border); }
  #thumb-container { flex-direction: row; }
  .thumb-wrapper { width: 90px; flex-shrink: 0; }
  .btn span, .tool-btn span { display: none; }
}

#welcome-screen {
  position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; 
  align-items: center; justify-content: center; z-index: 200;
}
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  padding: 10px 20px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); font-size: 13px; display: none; z-index: 1000;
}
</style>
</head>
<body>

<div id="app">
  <header id="header">
    <div class="logo">PDF<span>PRO</span></div>
    <button class="btn btn-primary" onclick="triggerFile()"><span>Open PDF</span></button>
    <button class="btn btn-ghost" id="dl-btn" onclick="exportPDF()" disabled><span>Download</span></button>
    <div style="flex:1"></div>
    <button class="btn btn-danger" id="del-pg-btn" onclick="deleteCurrentPage()" disabled><span>Delete Page</span></button>
  </header>

  <div id="workspace">
    <aside id="sidebar">
      <div id="thumb-container"></div>
    </aside>

    <main id="editor-area">
      <div id="tools">
        <button class="tool-btn active" id="t-select" onclick="setTool('select')"><span>Select</span></button>
        <button class="tool-btn" id="t-redact" onclick="setTool('redact')"><span>Redact Box</span></button>
        <button class="tool-btn" id="t-white" onclick="setTool('white')"><span>White Box</span></button>
        <button class="tool-btn" id="t-text" onclick="setTool('text')"><span>Add Text</span></button>
        <div style="width:1px; height:20px; background:var(--border); margin:0 5px;"></div>
        <button class="tool-btn" onclick="copyObj()"><span>Copy</span></button>
        <button class="tool-btn" onclick="pasteObj()"><span>Paste</span></button>
      </div>

      <div id="canvas-outer">
        <div id="canvas-viewport" style="display:none">
          <canvas id="pdf-render-canvas"></canvas>
          <div id="fabric-canvas-container">
            <canvas id="f-canvas"></canvas>
          </div>
        </div>
        
        <div id="welcome-screen">
          <button class="btn btn-primary" style="padding:15px 40px" onclick="triggerFile()">Select a PDF to Edit</button>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="file-input" accept="application/pdf" style="display:none" onchange="handleFile(this)">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null, pdfBytes = null, fCanvas = null;
let currentPage = 1, totalPages = 0, currentScale = 1.5;
let pageEdits = {}, clipboard = null;
let activeTool = 'select';

function triggerFile() { document.getElementById('file-input').click(); }

async function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const buffer = await file.arrayBuffer();
  pdfBytes = new Uint8Array(buffer);
  initEditor();
}

async function initEditor() {
  try {
    msg('Initializing...');
    pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
    totalPages = pdfDoc.numPages;
    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('canvas-viewport').style.display = 'block';
    document.getElementById('dl-btn').disabled = false;
    document.getElementById('del-pg-btn').disabled = false;
    await refreshThumbnails();
    await loadPage(1);
  } catch(e) { msg('Error: ' + e.message, '#ff4757'); }
}

async function refreshThumbnails() {
  const container = document.getElementById('thumb-container');
  container.innerHTML = '';
  for (let i = 1; i <= totalPages; i++) {
    const wrapper = document.createElement('div');
    wrapper.className = `thumb-wrapper ${i === currentPage ? 'active' : ''}`;
    wrapper.onclick = () => { currentPage = i; loadPage(i, true); };
    const canvas = document.createElement('canvas');
    const page = await pdfDoc.getPage(i);
    const vp = page.getViewport({ scale: 0.25 });
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    const label = document.createElement('div');
    label.className = 'thumb-label'; label.textContent = i;
    wrapper.append(canvas, label);
    container.appendChild(wrapper);
  }
}

async function loadPage(num, autoZoom = false) {
  if (fCanvas) pageEdits[currentPage] = fCanvas.toJSON();
  currentPage = num;
  if (autoZoom) currentScale = 1.8; // Automatic zoom when selected

  const page = await pdfDoc.getPage(num);
  const vp = page.getViewport({ scale: currentScale });
  const pdfCanv = document.getElementById('pdf-render-canvas');
  pdfCanv.width = vp.width; pdfCanv.height = vp.height;
  await page.render({ canvasContext: pdfCanv.getContext('2d'), viewport: vp }).promise;

  const view = document.getElementById('canvas-viewport');
  view.style.width = vp.width + 'px'; view.style.height = vp.height + 'px';

  if (fCanvas) fCanvas.dispose();
  fCanvas = new fabric.Canvas('f-canvas', { width: vp.width, height: vp.height });
  if (pageEdits[num]) fCanvas.loadFromJSON(pageEdits[num], () => fCanvas.renderAll());
  
  initFabricEvents();
  setTool(activeTool);
  document.querySelectorAll('.thumb-wrapper').forEach((t, idx) => t.classList.toggle('active', idx + 1 === num));
}

async function deleteCurrentPage() {
  if (totalPages <= 1) return msg('Action denied', '#ff4757');
  const { PDFDocument } = PDFLib;
  const doc = await PDFDocument.load(pdfBytes);
  doc.removePage(currentPage - 1);
  pdfBytes = await doc.save();
  pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
  totalPages = pdfDoc.numPages;
  const next = currentPage > totalPages ? totalPages : currentPage;
  await refreshThumbnails();
  await loadPage(next);
  msg('Page Deleted');
}

function setTool(t) {
  activeTool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.id === 't-'+t));
  if (!fCanvas) return;
  fCanvas.selection = (t === 'select');
  fCanvas.defaultCursor = (t === 'select') ? 'default' : 'crosshair';
}

function initFabricEvents() {
  let isDown = false, startX, startY, activeObj;
  fCanvas.on('mouse:down', (o) => {
    if (activeTool === 'select') return;
    isDown = true;
    const p = fCanvas.getPointer(o.e);
    startX = p.x; startY = p.y;
    if (activeTool === 'redact' || activeTool === 'white') {
      activeObj = new fabric.Rect({
        left: p.x, top: p.y, width: 0, height: 0,
        fill: activeTool === 'redact' ? 'black' : 'white', selectable: true
      });
      fCanvas.add(activeObj);
    } else if (activeTool === 'text') {
      const txt = prompt("Text:");
      if (txt) fCanvas.add(new fabric.IText(txt, { left: p.x, top: p.y, fontSize: 24, fill: '#e8ff47' }));
      isDown = false;
    }
  });
  fCanvas.on('mouse:move', (o) => {
    if (!isDown || activeTool === 'select') return;
    const p = fCanvas.getPointer(o.e);
    activeObj.set({ width: Math.abs(startX-p.x), height: Math.abs(startY-p.y), left: Math.min(p.x, startX), top: Math.min(p.y, startY) });
    fCanvas.renderAll();
  });
  fCanvas.on('mouse:up', () => { isDown = false; if(activeTool!=='select') setTool('select'); });
}

function copyObj() { fCanvas.getActiveObject()?.clone(c => clipboard = c); msg('Box Copied'); }
function pasteObj() {
  if (!clipboard) return;
  clipboard.clone(cloned => {
    cloned.set({ left: cloned.left + 15, top: cloned.top + 15, evented: true });
    fCanvas.add(cloned); fCanvas.setActiveObject(cloned); fCanvas.renderAll();
  });
}

async function exportPDF() {
  if (fCanvas) pageEdits[currentPage] = fCanvas.toJSON();
  msg('Generating PDF...');
  try {
    const { PDFDocument, grayscale, rgb } = PDFLib;
    const doc = await PDFDocument.load(pdfBytes);
    const pages = doc.getPages();
    for (let i = 0; i < pages.length; i++) {
      const edits = pageEdits[i + 1];
      if (!edits || !edits.objects) continue;
      const pdfPage = pages[i];
      const { width, height } = pdfPage.getSize();
      const pjsPage = await pdfDoc.getPage(i + 1);
      const vp = pjsPage.getViewport({ scale: currentScale });
      const sx = width / vp.width, sy = height / vp.height;
      for (const o of edits.objects) {
        const x = o.left * sx, y = height - ((o.top + (o.height * o.scaleY)) * sy);
        if (o.type === 'rect') {
          pdfPage.drawRectangle({ x, y, width: o.width * o.scaleX * sx, height: o.height * o.scaleY * sy, color: o.fill === 'black' ? grayscale(0) : grayscale(1) });
        } else if (o.type === 'i-text' || o.type === 'text') {
          pdfPage.drawText(o.text, { x, y: height - (o.top * sy) - (o.fontSize * sy), size: o.fontSize * sy, color: rgb(0.9, 1, 0) });
        }
      }
    }
    const b = await doc.save();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([b], {type:'application/pdf'}));
    link.download = "final_output.pdf"; link.click();
    msg('Done!', '#47ffb0');
  } catch(e) { msg('Error exporting', '#ff4757'); }
}

function msg(m, c = '#fff') {
  const t = document.getElementById('toast');
  t.textContent = m; t.style.display = 'block'; t.style.color = c;
  setTimeout(() => t.style.display = 'none', 2500);
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') { fCanvas.getActiveObjects().forEach(obj => fCanvas.remove(obj)); fCanvas.discardActiveObject().renderAll(); }
});
</script>
</body>
</html>
