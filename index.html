<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>PDF Editor — Local</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- pdf-lib -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<!-- Fabric.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0c;
  --surface: #111116;
  --panel: #16161d;
  --border: #252530;
  --accent: #e8ff47;
  --accent2: #ff4757;
  --accent3: #47c8ff;
  --text: #f0f0f5;
  --muted: #6b6b80;
  --danger: #ff4757;
  --success: #47ffb0;
  --radius: 10px;
  --sidebar: 260px;
  --toolbar: 56px;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── LAYOUT ── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── TOP BAR ── */
#topbar {
  height: var(--toolbar);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  flex-shrink: 0;
  z-index: 100;
}
#topbar .logo {
  font-size: 15px; font-weight: 800; letter-spacing: -0.5px;
  color: var(--accent); white-space: nowrap;
}
#topbar .logo span { color: var(--text); }
.tb-sep { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }

/* ── FILE ACTIONS ── */
.tb-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 7px; border: none; cursor: pointer;
  font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600;
  transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
.tb-btn.primary { background: var(--accent); color: #111; }
.tb-btn.primary:hover { background: #d4eb30; transform: translateY(-1px); }
.tb-btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.tb-btn.ghost:hover { color: var(--text); border-color: var(--muted); }
.tb-btn.danger { background: rgba(255,71,87,.15); color: var(--danger); border: 1px solid rgba(255,71,87,.3); }
.tb-btn.danger:hover { background: rgba(255,71,87,.25); }
.tb-btn:disabled { opacity: .35; pointer-events: none; }
.tb-btn svg { flex-shrink: 0; }

/* page info */
#page-info { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-left: auto; white-space: nowrap; }

/* ── BODY ── */
#body { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden; flex-shrink: 0;
}
#sidebar-header {
  padding: 12px 14px;
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#page-list {
  flex: 1; overflow-y: auto; padding: 8px;
  display: flex; flex-direction: column; gap: 6px;
}
.page-thumb {
  border-radius: 7px; border: 2px solid var(--border);
  background: var(--panel); cursor: pointer;
  transition: all .15s; overflow: hidden;
  position: relative;
}
.page-thumb:hover { border-color: var(--muted); }
.page-thumb.active { border-color: var(--accent); }
.page-thumb.marked-delete { border-color: var(--danger); opacity: .5; }
.page-thumb canvas { width: 100% !important; height: auto !important; display: block; }
.page-thumb .thumb-label {
  position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-family: 'JetBrains Mono', monospace;
  background: rgba(0,0,0,.75); color: var(--text);
  padding: 2px 6px; border-radius: 4px;
}
.page-thumb .del-badge {
  position: absolute; top: 4px; right: 4px;
  background: var(--danger); color: #fff;
  font-size: 9px; font-weight: 700;
  padding: 2px 5px; border-radius: 4px; display: none;
}
.page-thumb.marked-delete .del-badge { display: block; }

/* ── MAIN ── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

/* ── TOOL BAR ── */
#toolbar {
  height: var(--toolbar);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 4px;
  padding: 0 12px;
  flex-shrink: 0; overflow-x: auto;
}
.tool-group { display: flex; align-items: center; gap: 2px; }
.tool-sep { width: 1px; height: 24px; background: var(--border); margin: 0 6px; flex-shrink: 0; }
.tool-btn {
  width: 36px; height: 36px; border-radius: 7px; border: none; cursor: pointer;
  background: transparent; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0;
}
.tool-btn:hover { background: var(--border); color: var(--text); }
.tool-btn.active { background: rgba(232,255,71,.12); color: var(--accent); }
.tool-btn.active-danger { background: rgba(255,71,87,.12); color: var(--danger); }
.tool-btn:disabled { opacity: .3; pointer-events: none; }

/* color & size pickers */
.color-swatch {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
  cursor: pointer; flex-shrink: 0;
}
.color-swatch:hover { border-color: var(--muted); }
#color-pick { position: absolute; opacity: 0; width: 0; height: 0; }
.size-label { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
#brush-size { width: 70px; accent-color: var(--accent); }

/* ── CANVAS WRAPPER ── */
#canvas-wrap {
  flex: 1; overflow: auto;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px;
}
#canvas-container {
  position: relative; box-shadow: 0 8px 64px rgba(0,0,0,.6);
  border-radius: 4px; overflow: hidden;
}
#pdf-canvas { display: block; }
#fabric-canvas-el { position: absolute; top: 0; left: 0; }

/* ── DROP ZONE ── */
#drop-zone {
  position: fixed; inset: 0;
  background: rgba(10,10,12,.9);
  border: 3px dashed var(--accent);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; z-index: 999;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#drop-zone.active { opacity: 1; pointer-events: all; }
#drop-zone .dz-icon { font-size: 64px; }
#drop-zone p { font-size: 18px; font-weight: 700; color: var(--accent); }

/* ── WELCOME ── */
#welcome {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: var(--bg); z-index: 10;
}
#welcome h1 { font-size: clamp(28px, 5vw, 48px); font-weight: 800; color: var(--text); text-align: center; }
#welcome h1 span { color: var(--accent); }
#welcome p { color: var(--muted); font-size: 14px; text-align: center; max-width: 380px; line-height: 1.7; }
.upload-area {
  width: min(340px, 90vw); height: 160px;
  border: 2px dashed var(--border); border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; cursor: pointer; transition: all .2s;
  color: var(--muted); font-size: 13px; text-align: center; padding: 16px;
}
.upload-area:hover { border-color: var(--accent); color: var(--text); background: rgba(232,255,71,.04); }
.upload-area svg { width: 36px; height: 36px; color: var(--accent); }
.upload-area strong { font-size: 15px; font-weight: 700; color: var(--text); display: block; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--panel); border: 1px solid var(--border);
  padding: 10px 20px; border-radius: 8px;
  font-size: 13px; color: var(--text); z-index: 9999;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none; white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.ok { border-color: var(--success); color: var(--success); }
#toast.err { border-color: var(--danger); color: var(--danger); }

/* ── MODAL ── */
#modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s;
}
#modal-overlay.open { opacity: 1; pointer-events: all; }
#modal {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px; width: min(400px, 92vw);
  transform: scale(.95); transition: transform .2s;
}
#modal-overlay.open #modal { transform: scale(1); }
#modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
#modal p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
#modal-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 7px; padding: 10px 12px; color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  margin-bottom: 16px;
}
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  :root { --sidebar: 0px; }
  #sidebar { display: none; }
  #canvas-wrap { padding: 8px; }
  .tb-btn .btn-label { display: none; }
}
</style>
</head>
<body>

<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="logo">PDF<span>Edit</span></div>
    <div class="tb-sep"></div>
    <button class="tb-btn primary" id="btn-open" onclick="triggerOpen()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="btn-label">Open PDF</span>
    </button>
    <button class="tb-btn ghost" id="btn-save" onclick="savePDF()" disabled>
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span class="btn-label">Download</span>
    </button>
    <div class="tb-sep"></div>
    <button class="tb-btn danger" id="btn-del-page" onclick="markDeletePage()" disabled title="Mark current page for deletion">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      <span class="btn-label">Delete Page</span>
    </button>
    <span id="page-info">No file loaded</span>
  </div>

  <!-- BODY -->
  <div id="body">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="sidebar-header">Pages</div>
      <div id="page-list"></div>
    </div>

    <!-- MAIN -->
    <div id="main">
      <!-- TOOL BAR -->
      <div id="toolbar">
        <div class="tool-group">
          <button class="tool-btn" id="tool-cursor" onclick="setTool('cursor')" title="Select / Move" disabled>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 3l14 9-7 1-3 7z"/></svg>
          </button>
          <button class="tool-btn" id="tool-redact" onclick="setTool('redact')" title="Redact (black box)" disabled>
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/></svg>
          </button>
          <button class="tool-btn" id="tool-white" onclick="setTool('white')" title="White-out (erase area)" disabled>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
          </button>
          <button class="tool-btn" id="tool-draw" onclick="setTool('draw')" title="Free Draw" disabled>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="12" cy="12" r="2"/></svg>
          </button>
          <button class="tool-btn" id="tool-text" onclick="setTool('text')" title="Add Text" disabled>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          </button>
          <button class="tool-btn" id="tool-highlight" onclick="setTool('highlight')" title="Highlight" disabled>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>
        <div class="tool-sep"></div>
        <div class="tool-group">
          <button class="tool-btn" id="btn-undo" onclick="undoFabric()" title="Undo" disabled>
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
          </button>
          <button class="tool-btn" id="btn-del-obj" onclick="deleteSelected()" title="Delete Selected Object" disabled>
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <button class="tool-btn" id="btn-clear-page" onclick="clearPage()" title="Clear All Edits on Page" disabled>
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 0 12 4"/><polyline points="20 4 20 11 13 11"/></svg>
          </button>
        </div>
        <div class="tool-sep"></div>
        <div class="tool-group" style="align-items:center; gap:8px;">
          <div class="color-swatch" id="color-swatch" onclick="document.getElementById('color-pick').click()" style="background:#e8ff47;"></div>
          <input type="color" id="color-pick" value="#e8ff47" oninput="updateColor(this.value)" />
          <span class="size-label">Size</span>
          <input type="range" id="brush-size" min="2" max="40" value="10" oninput="updateBrushSize(this.value)" disabled />
          <span class="size-label" id="size-val">10</span>
        </div>
        <div class="tool-sep"></div>
        <!-- Zoom -->
        <div class="tool-group" style="align-items:center; gap:4px;">
          <button class="tool-btn" onclick="zoom(-0.15)" title="Zoom Out" disabled id="btn-zoom-out">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <span id="zoom-label" style="font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);width:42px;text-align:center;">100%</span>
          <button class="tool-btn" onclick="zoom(0.15)" title="Zoom In" disabled id="btn-zoom-in">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
          </button>
        </div>
      </div>

      <!-- CANVAS -->
      <div id="canvas-wrap">
        <!-- WELCOME -->
        <div id="welcome">
          <h1>PDF <span>Editor</span></h1>
          <p>100% local — works offline, no server, no uploads.<br>All processing happens in your browser.</p>
          <div class="upload-area" onclick="triggerOpen()" id="upload-area">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 13h6m-3-3v6m-9 1V7a2 2 0 0 1 2-2h6l2 2h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span><strong>Click to open PDF</strong>or drag &amp; drop here</span>
            <span style="font-size:11px;opacity:.6;">Supports all standard PDFs</span>
          </div>
        </div>

        <div id="canvas-container" style="display:none;">
          <canvas id="pdf-canvas"></canvas>
          <canvas id="fabric-canvas-el"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- DROP ZONE -->
<div id="drop-zone">
  <div class="dz-icon">📄</div>
  <p>Drop your PDF here</p>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">Add Text</h2>
    <p id="modal-desc">Type the text you want to add to the page.</p>
    <input type="text" id="modal-input" placeholder="Enter text..." />
    <div class="modal-actions">
      <button class="tb-btn ghost" onclick="closeModal()">Cancel</button>
      <button class="tb-btn primary" onclick="confirmModal()">Add</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".pdf" style="display:none" onchange="loadFile(this)" />

<script>
// ── PDF.js worker ──
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── State ──
let pdfDoc = null;       // PDF.js doc
let pdfBytes = null;     // raw bytes of current PDF
let currentPage = 1;
let totalPages = 0;
let scale = 1.5;
let currentTool = 'cursor';
let currentColor = '#e8ff47';
let brushSize = 10;
let pageEdits = {};      // { pageNum: [fabricJSON...] }
let deletedPages = new Set();
let fabricCanvas = null;
let history = [];        // undo stack (per-page overwritten state)
let isDrawing = false;
let rectStart = null;
let tempRect = null;
let pendingTextPos = null;
let currentFilename = 'edited.pdf';

// ── File open ──
function triggerOpen() { document.getElementById('file-input').click(); }

async function loadFile(inp) {
  const file = inp.files[0];
  if (!file) return;
  inp.value = '';
  currentFilename = file.name.replace('.pdf', '-edited.pdf');
  const ab = await file.arrayBuffer();
  pdfBytes = new Uint8Array(ab);
  await openPDFBytes(pdfBytes);
}

async function openPDFBytes(bytes) {
  try {
    showToast('Loading PDF…', '');
    pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
    totalPages = pdfDoc.numPages;
    currentPage = 1;
    deletedPages = new Set();
    pageEdits = {};
    history = [];

    document.getElementById('welcome').style.display = 'none';
    document.getElementById('canvas-container').style.display = 'block';

    enableUI(true);
    await buildThumbs();
    await renderPage(currentPage);
    showToast(`Loaded — ${totalPages} page${totalPages > 1 ? 's' : ''}`, 'ok');
  } catch (e) {
    showToast('Failed to load PDF', 'err');
    console.error(e);
  }
}

// ── Enable / Disable UI ──
function enableUI(on) {
  ['btn-save','btn-del-page','tool-cursor','tool-redact','tool-white','tool-draw','tool-text','tool-highlight',
   'btn-undo','btn-del-obj','btn-clear-page','btn-zoom-in','btn-zoom-out','brush-size']
    .forEach(id => { const el = document.getElementById(id); if (el) el.disabled = !on; });
  if (on) setTool('cursor');
}

// ── Thumbnails ──
async function buildThumbs() {
  const list = document.getElementById('page-list');
  list.innerHTML = '';
  for (let i = 1; i <= totalPages; i++) {
    const thumb = document.createElement('div');
    thumb.className = 'page-thumb';
    thumb.id = `thumb-${i}`;
    thumb.onclick = () => goToPage(i);

    const tc = document.createElement('canvas');
    const page = await pdfDoc.getPage(i);
    const vp = page.getViewport({ scale: 0.22 });
    tc.width = vp.width; tc.height = vp.height;
    await page.render({ canvasContext: tc.getContext('2d'), viewport: vp }).promise;
    thumb.appendChild(tc);

    const lbl = document.createElement('div');
    lbl.className = 'thumb-label';
    lbl.textContent = i;
    thumb.appendChild(lbl);

    const badge = document.createElement('div');
    badge.className = 'del-badge';
    badge.textContent = '✕';
    thumb.appendChild(badge);

    list.appendChild(thumb);
  }
  updateThumbActive();
}

function updateThumbActive() {
  for (let i = 1; i <= totalPages; i++) {
    const t = document.getElementById(`thumb-${i}`);
    if (!t) continue;
    t.classList.toggle('active', i === currentPage);
    t.classList.toggle('marked-delete', deletedPages.has(i));
  }
}

// ── Render Page ──
async function renderPage(num) {
  saveCurrentEdits();
  currentPage = num;
  updateThumbActive();

  const page = await pdfDoc.getPage(num);
  const vp = page.getViewport({ scale });

  const pCanvas = document.getElementById('pdf-canvas');
  const ctx = pCanvas.getContext('2d');
  pCanvas.width = vp.width;
  pCanvas.height = vp.height;
  await page.render({ canvasContext: ctx, viewport: vp }).promise;

  // Set fabric canvas size
  const fEl = document.getElementById('fabric-canvas-el');
  fEl.width = vp.width;
  fEl.height = vp.height;

  const container = document.getElementById('canvas-container');
  container.style.width = vp.width + 'px';
  container.style.height = vp.height + 'px';

  if (fabricCanvas) fabricCanvas.dispose();
  fabricCanvas = new fabric.Canvas('fabric-canvas-el', {
    width: vp.width, height: vp.height,
    selection: true,
    isDrawingMode: false,
    backgroundColor: 'transparent',
  });

  // Restore saved edits for this page
  if (pageEdits[num]) {
    await new Promise(res => fabricCanvas.loadFromJSON(pageEdits[num], () => {
      fabricCanvas.renderAll(); res();
    }));
  }

  fabricCanvas.on('selection:created', () => document.getElementById('btn-del-obj').disabled = false);
  fabricCanvas.on('selection:cleared', () => document.getElementById('btn-del-obj').disabled = true);

  // Mouse events for rect tools
  fabricCanvas.on('mouse:down', onFabricMouseDown);
  fabricCanvas.on('mouse:move', onFabricMouseMove);
  fabricCanvas.on('mouse:up', onFabricMouseUp);

  applyToolToCanvas();
  updatePageInfo();
}

function saveCurrentEdits() {
  if (fabricCanvas && currentPage) {
    pageEdits[currentPage] = fabricCanvas.toJSON();
  }
}

function updatePageInfo() {
  const del = deletedPages.size > 0 ? ` · ${deletedPages.size} marked` : '';
  document.getElementById('page-info').textContent = `Page ${currentPage} / ${totalPages}${del}`;
}

// ── Tools ──
function setTool(t) {
  currentTool = t;
  ['cursor','redact','white','draw','text','highlight'].forEach(id => {
    const btn = document.getElementById('tool-'+id);
    if (btn) btn.classList.remove('active', 'active-danger');
  });
  const activeBtn = document.getElementById('tool-'+t);
  if (activeBtn) {
    if (t === 'redact') activeBtn.classList.add('active-danger');
    else activeBtn.classList.add('active');
  }
  document.getElementById('brush-size').disabled = (t !== 'draw');
  applyToolToCanvas();
}

function applyToolToCanvas() {
  if (!fabricCanvas) return;
  fabricCanvas.isDrawingMode = currentTool === 'draw';
  fabricCanvas.selection = currentTool === 'cursor';
  fabricCanvas.defaultCursor = currentTool === 'text' ? 'text' : (currentTool === 'cursor' ? 'default' : 'crosshair');
  if (currentTool === 'draw') {
    fabricCanvas.freeDrawingBrush.color = currentColor;
    fabricCanvas.freeDrawingBrush.width = brushSize;
  }
  fabricCanvas.getObjects().forEach(o => {
    o.selectable = currentTool === 'cursor';
    o.evented = currentTool === 'cursor';
  });
}

// ── Mouse: Rect drawing for redact/white/highlight ──
let rectDrawing = false;
let startX = 0, startY = 0;

function onFabricMouseDown(opt) {
  if (!['redact','white','highlight'].includes(currentTool)) return;
  const p = fabricCanvas.getPointer(opt.e);
  startX = p.x; startY = p.y;
  rectDrawing = true;
  const fill = currentTool === 'redact' ? '#000000' :
               currentTool === 'white' ? '#ffffff' :
               hexToRgba(currentColor, 0.4);
  tempRect = new fabric.Rect({
    left: p.x, top: p.y, width: 1, height: 1,
    fill, selectable: false, evented: false,
    opacity: currentTool === 'highlight' ? 0.5 : 1,
  });
  fabricCanvas.add(tempRect);
}
function onFabricMouseMove(opt) {
  if (!rectDrawing || !tempRect) return;
  const p = fabricCanvas.getPointer(opt.e);
  const w = p.x - startX, h = p.y - startY;
  tempRect.set({
    left: w < 0 ? p.x : startX,
    top: h < 0 ? p.y : startY,
    width: Math.abs(w), height: Math.abs(h)
  });
  fabricCanvas.renderAll();
}
function onFabricMouseUp(opt) {
  if (!rectDrawing) return;
  rectDrawing = false;
  if (!tempRect) return;
  if (tempRect.width < 3 && tempRect.height < 3) {
    fabricCanvas.remove(tempRect);
    // text tool click
    if (currentTool === 'text') {
      const p = fabricCanvas.getPointer(opt.e);
      openTextModal(p.x, p.y);
    }
    tempRect = null; return;
  }
  tempRect.set({ selectable: true, evented: true });
  fabricCanvas.setActiveObject(tempRect);
  tempRect = null;
  pushHistory();
}

fabricCanvas; // silence lint

// ── Text tool click ──
document.getElementById('canvas-container').addEventListener('click', function(e) {
  if (currentTool !== 'text' || !fabricCanvas) return;
  const rect = document.getElementById('canvas-container').getBoundingClientRect();
  const x = (e.clientX - rect.left) / 1;
  const y = (e.clientY - rect.top) / 1;
  const p = { x, y };
  pendingTextPos = p;
  openTextModal(p.x, p.y);
});

// ── Zoom ──
function zoom(delta) {
  scale = Math.min(3, Math.max(0.4, scale + delta));
  document.getElementById('zoom-label').textContent = Math.round(scale / 1.5 * 100) + '%';
  renderPage(currentPage);
}

// ── Page navigation ──
function goToPage(n) {
  saveCurrentEdits();
  renderPage(n);
}

// ── Delete page ──
function markDeletePage() {
  if (deletedPages.has(currentPage)) {
    deletedPages.delete(currentPage);
    showToast(`Page ${currentPage} restored`, 'ok');
  } else {
    if (totalPages - deletedPages.size <= 1) {
      showToast("Can't delete all pages", 'err'); return;
    }
    deletedPages.add(currentPage);
    showToast(`Page ${currentPage} marked for deletion`, '');
  }
  updateThumbActive();
  updatePageInfo();
}

// ── Delete selected object ──
function deleteSelected() {
  if (!fabricCanvas) return;
  const obj = fabricCanvas.getActiveObject();
  if (!obj) return;
  if (obj.type === 'activeSelection') {
    obj.getObjects().forEach(o => fabricCanvas.remove(o));
    fabricCanvas.discardActiveObject();
  } else {
    fabricCanvas.remove(obj);
  }
  fabricCanvas.renderAll();
  pushHistory();
}

// ── Clear page ──
function clearPage() {
  if (!fabricCanvas) return;
  fabricCanvas.clear();
  fabricCanvas.setBackgroundColor('transparent', fabricCanvas.renderAll.bind(fabricCanvas));
  pageEdits[currentPage] = null;
  showToast('Page edits cleared', '');
}

// ── Undo ──
function pushHistory() {
  history.push(fabricCanvas.toJSON());
  if (history.length > 30) history.shift();
}
function undoFabric() {
  if (history.length < 2) { showToast('Nothing to undo', ''); return; }
  history.pop();
  const prev = history[history.length - 1];
  fabricCanvas.loadFromJSON(prev, () => { fabricCanvas.renderAll(); applyToolToCanvas(); });
}

// ── Color / Size ──
function updateColor(val) {
  currentColor = val;
  document.getElementById('color-swatch').style.background = val;
  if (fabricCanvas && currentTool === 'draw') {
    fabricCanvas.freeDrawingBrush.color = val;
  }
}
function updateBrushSize(val) {
  brushSize = parseInt(val);
  document.getElementById('size-val').textContent = val;
  if (fabricCanvas && currentTool === 'draw') {
    fabricCanvas.freeDrawingBrush.width = brushSize;
  }
}

// ── Text Modal ──
function openTextModal(x, y) {
  pendingTextPos = { x, y };
  document.getElementById('modal-title').textContent = 'Add Text';
  document.getElementById('modal-desc').textContent = 'Type the text to place on the page.';
  document.getElementById('modal-input').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-input').focus(), 100);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  pendingTextPos = null;
}
function confirmModal() {
  const val = document.getElementById('modal-input').value.trim();
  closeModal();
  if (!val || !pendingTextPos || !fabricCanvas) return;
  const txt = new fabric.Text(val, {
    left: pendingTextPos.x, top: pendingTextPos.y,
    fontSize: brushSize * 2, fill: currentColor,
    fontFamily: 'JetBrains Mono, monospace',
    selectable: true, editable: true,
  });
  fabricCanvas.add(txt);
  fabricCanvas.setActiveObject(txt);
  fabricCanvas.renderAll();
  pushHistory();
}
document.getElementById('modal-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmModal();
  if (e.key === 'Escape') closeModal();
});

// ── SAVE / DOWNLOAD ──
async function savePDF() {
  if (!pdfBytes) return;
  saveCurrentEdits();
  showToast('Building PDF…', '');
  try {
    const { PDFDocument, rgb, grayscale } = PDFLib;
    const srcDoc = await PDFDocument.load(pdfBytes, { ignoreEncryption: true });
    const newDoc = await PDFDocument.create();

    // Copy non-deleted pages
    const keepPages = [];
    for (let i = 0; i < totalPages; i++) {
      if (!deletedPages.has(i + 1)) keepPages.push(i);
    }
    const copied = await newDoc.copyPages(srcDoc, keepPages);
    copied.forEach(p => newDoc.addPage(p));

    // Burn in fabric edits
    const pages = newDoc.getPages();
    for (let idx = 0; idx < keepPages.length; idx++) {
      const origPageNum = keepPages[idx] + 1;
      const edits = pageEdits[origPageNum];
      if (!edits || !edits.objects || edits.objects.length === 0) continue;

      const pdfPage = pages[idx];
      const { width: pW, height: pH } = pdfPage.getSize();

      // We need pixel dimensions from PDF.js to scale coords
      const pjsPage = await pdfDoc.getPage(origPageNum);
      const vp = pjsPage.getViewport({ scale });
      const scaleX = pW / vp.width;
      const scaleY = pH / vp.height;

      for (const obj of edits.objects) {
        if (obj.type === 'rect') {
          const x = obj.left * scaleX;
          const y = pH - (obj.top + obj.height * (obj.scaleY || 1)) * scaleY;
          const w = obj.width * (obj.scaleX || 1) * scaleX;
          const h = obj.height * (obj.scaleY || 1) * scaleY;
          let fill;
          if (obj.fill === '#000000' || obj.fill === 'black') fill = grayscale(0);
          else if (obj.fill === '#ffffff' || obj.fill === 'white') fill = grayscale(1);
          else fill = hexToRgbLib(obj.fill, PDFLib);
          pdfPage.drawRectangle({ x, y, width: w, height: h, color: fill, opacity: obj.opacity ?? 1 });
        }
        if (obj.type === 'path') {
          // Burn paths as rasterized image via canvas
          await burnPathAsImage(pdfPage, obj, vp, pW, pH);
        }
        if (obj.type === 'text' || obj.type === 'i-text') {
          const x = obj.left * scaleX;
          const y = pH - (obj.top + (obj.fontSize || 16)) * scaleY;
          pdfPage.drawText(obj.text, {
            x, y,
            size: Math.round((obj.fontSize || 16) * scaleY),
            color: hexToRgbLib(obj.fill || '#e8ff47', PDFLib),
          });
        }
      }
    }

    const finalBytes = await newDoc.save();
    downloadBytes(finalBytes, currentFilename);
    showToast('PDF downloaded!', 'ok');
  } catch (e) {
    showToast('Export failed: ' + e.message, 'err');
    console.error(e);
  }
}

// Rasterise a fabric path object to a PNG and embed it in the PDF page
async function burnPathAsImage(pdfPage, obj, vp, pW, pH) {
  try {
    const offscreen = document.createElement('canvas');
    offscreen.width = vp.width;
    offscreen.height = vp.height;
    const tmpFab = new fabric.StaticCanvas(offscreen, { width: vp.width, height: vp.height, backgroundColor: 'transparent' });
    await new Promise(res => tmpFab.loadFromJSON({ objects: [obj], background: '' }, res));
    tmpFab.renderAll();
    const dataUrl = offscreen.toDataURL('image/png');
    const b64 = dataUrl.split(',')[1];
    const imgBytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const img = await pdfPage.doc.embedPng(imgBytes);
    pdfPage.drawImage(img, { x: 0, y: 0, width: pW, height: pH });
    tmpFab.dispose();
  } catch (e) { console.warn('Path burn failed', e); }
}

function hexToRgbLib(hex, PDFLib) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const r = parseInt(hex.substring(0,2), 16) / 255;
  const g = parseInt(hex.substring(2,4), 16) / 255;
  const b = parseInt(hex.substring(4,6), 16) / 255;
  return PDFLib.rgb(r, g, b);
}
function hexToRgba(hex, a) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const r = parseInt(hex.substring(0,2), 16);
  const g = parseInt(hex.substring(2,4), 16);
  const b = parseInt(hex.substring(4,6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function downloadBytes(bytes, name) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ── Drag & Drop ──
const dz = document.getElementById('drop-zone');
document.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('active'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) dz.classList.remove('active'); });
document.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') {
    currentFilename = file.name.replace('.pdf', '-edited.pdf');
    file.arrayBuffer().then(ab => {
      pdfBytes = new Uint8Array(ab);
      openPDFBytes(pdfBytes);
    });
  } else {
    showToast('Please drop a PDF file', 'err');
  }
});

// ── Upload area drag hover ──
const ua = document.getElementById('upload-area');
if (ua) {
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.style.borderColor = 'var(--accent)'; });
  ua.addEventListener('dragleave', () => { ua.style.borderColor = ''; });
  ua.addEventListener('drop', e => { e.preventDefault(); });
}

// ── Toast ──
let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2800);
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  if (e.ctrlKey && e.key === 'z') undoFabric();
  if (e.key === 'r') setTool('redact');
  if (e.key === 'w') setTool('white');
  if (e.key === 'd') setTool('draw');
  if (e.key === 't') setTool('text');
  if (e.key === 'h') setTool('highlight');
  if (e.key === 'Escape') setTool('cursor');
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { if (currentPage < totalPages) goToPage(currentPage + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { if (currentPage > 1) goToPage(currentPage - 1); }
});
</script>
