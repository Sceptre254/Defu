<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local PDF Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>

body{
margin:0;
font-family:sans-serif;
background:#0a0a0c;
color:white;
overflow:hidden;
}

#app{
display:flex;
flex-direction:column;
height:100vh;
}

#topbar{
height:55px;
display:flex;
align-items:center;
gap:10px;
padding:0 12px;
background:#111116;
border-bottom:1px solid #252530;
}

button{
border:none;
padding:8px 12px;
border-radius:6px;
background:#252530;
color:white;
cursor:pointer;
}

.primary{
background:#e8ff47;
color:black;
}

#body{
flex:1;
display:flex;
overflow:hidden;
}

#sidebar{
width:240px;
background:#111116;
border-right:1px solid #252530;
overflow-y:auto;
}

.page-thumb{
border:2px solid #252530;
margin:6px;
border-radius:6px;
cursor:pointer;
}

.page-thumb.active{
border-color:#e8ff47;
}

#main{
flex:1;
display:flex;
flex-direction:column;
}

#toolbar{
height:50px;
display:flex;
gap:6px;
padding:0 10px;
align-items:center;
border-bottom:1px solid #252530;
overflow-x:auto;
}

#canvas-wrap{
flex:1;
overflow:auto;
display:flex;
justify-content:center;
padding:20px;
}

#canvas-container{
position:relative;
}

#fabric-canvas-el{
position:absolute;
left:0;
top:0;
}

#mobile-nav{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
background:#16161d;
padding:8px;
border-radius:10px;
display:none;
gap:10px;
}

@media(max-width:700px){
#sidebar{display:none;}
#mobile-nav{display:flex;}
}

</style>
</head>

<body>

<div id="app">

<div id="topbar">
<button class="primary" onclick="triggerOpen()">Open</button>
<button onclick="savePDF()">Download</button>
<button onclick="insertImage()">Insert Image</button>
<span id="page-info"></span>
</div>

<div id="body">

<div id="sidebar">
<div id="page-list"></div>
</div>

<div id="main">

<div id="toolbar">
<button onclick="setTool('cursor')">Cursor</button>
<button onclick="setTool('draw')">Draw</button>
<button onclick="setTool('text')">Text</button>
<button onclick="setTool('redact')">Redact</button>
</div>

<div id="canvas-wrap">
<div id="canvas-container">
<canvas id="pdf-canvas"></canvas>
<canvas id="fabric-canvas-el"></canvas>
</div>
</div>

</div>
</div>
</div>

<div id="mobile-nav">
<button onclick="prevPage()">◀</button>
<span id="mobile-page">1</span>
<button onclick="nextPage()">▶</button>
</div>

<input type="file" id="file-input" accept=".pdf" style="display:none">
<input type="file" id="img-input" accept="image/*" style="display:none">

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDoc
let pdfBytes
let currentPage=1
let totalPages=0
let scale=1.5
let fabricCanvas
let pageEdits={}
let pageOrder=[]

function triggerOpen(){
document.getElementById("file-input").click()
}

document.getElementById("file-input").onchange=async e=>{
let file=e.target.files[0]
let ab=await file.arrayBuffer()
pdfBytes=new Uint8Array(ab)
openPDFBytes(pdfBytes)
}

async function openPDFBytes(bytes){

pdfDoc=await pdfjsLib.getDocument({data:bytes}).promise
totalPages=pdfDoc.numPages

pageOrder=[]
for(let i=1;i<=totalPages;i++)pageOrder.push(i)

buildThumbs()
renderPage(1)

}

async function buildThumbs(){

let list=document.getElementById("page-list")
list.innerHTML=""

for(let i=1;i<=totalPages;i++){

let page=await pdfDoc.getPage(i)
let vp=page.getViewport({scale:.2})

let c=document.createElement("canvas")
c.width=vp.width
c.height=vp.height

await page.render({
canvasContext:c.getContext("2d"),
viewport:vp
}).promise

let d=document.createElement("div")
d.className="page-thumb"
d.dataset.page=i
d.onclick=()=>goToPage(i)

d.appendChild(c)
list.appendChild(d)

}

Sortable.create(list,{
animation:150,
onEnd:e=>{
let item=pageOrder.splice(e.oldIndex,1)[0]
pageOrder.splice(e.newIndex,0,item)
}
})

}

async function renderPage(num){

currentPage=num

let page=await pdfDoc.getPage(num)
let vp=page.getViewport({scale})

let canvas=document.getElementById("pdf-canvas")
canvas.width=vp.width
canvas.height=vp.height

await page.render({
canvasContext:canvas.getContext("2d"),
viewport:vp
}).promise

let f=document.getElementById("fabric-canvas-el")
f.width=vp.width
f.height=vp.height

if(fabricCanvas)fabricCanvas.dispose()

fabricCanvas=new fabric.Canvas("fabric-canvas-el",{
width:vp.width,
height:vp.height
})

applyTool()

fabricCanvas.on("mouse:down",opt=>{
if(opt.target){
let timer=setTimeout(()=>{
fabricCanvas.remove(opt.target)
fabricCanvas.renderAll()
},800)
fabricCanvas.on("mouse:up",()=>clearTimeout(timer))
}
})

document.getElementById("mobile-page").innerText=num

}

function goToPage(n){
renderPage(n)
}

function nextPage(){
if(currentPage<totalPages)renderPage(currentPage+1)
}

function prevPage(){
if(currentPage>1)renderPage(currentPage-1)
}

let currentTool="cursor"

function setTool(t){
currentTool=t
applyTool()
}

function applyTool(){

if(!fabricCanvas)return

fabricCanvas.isDrawingMode=currentTool==="draw"

if(currentTool==="draw"){
fabricCanvas.freeDrawingBrush.width=5
fabricCanvas.freeDrawingBrush.color="yellow"
}

}

document.getElementById("canvas-container").onclick=e=>{

if(currentTool==="text"){

let rect=e.target.getBoundingClientRect()
let x=e.clientX-rect.left
let y=e.clientY-rect.top

let txt=new fabric.IText("Text",{
left:x,
top:y,
fill:"yellow",
fontSize:20
})

fabricCanvas.add(txt)

}

if(currentTool==="redact"){

let rect=e.target.getBoundingClientRect()
let x=e.clientX-rect.left
let y=e.clientY-rect.top

let box=new fabric.Rect({
left:x,
top:y,
width:120,
height:30,
fill:"black"
})

fabricCanvas.add(box)

}

}

function insertImage(){
document.getElementById("img-input").click()
}

document.getElementById("img-input").onchange=e=>{

let file=e.target.files[0]
let reader=new FileReader()

reader.onload=function(f){

fabric.Image.fromURL(f.target.result,function(img){

img.scaleToWidth(200)
fabricCanvas.add(img)

})

}

reader.readAsDataURL(file)

}

async function savePDF(){

const {PDFDocument,rgb}=PDFLib

const src=await PDFDocument.load(pdfBytes)
const newDoc=await PDFDocument.create()

const pages=await newDoc.copyPages(src,pageOrder.map(p=>p-1))
pages.forEach(p=>newDoc.addPage(p))

const bytes=await newDoc.save()

downloadBytes(bytes,"edited.pdf")

}

function downloadBytes(bytes,name){

let blob=new Blob([bytes],{type:"application/pdf"})
let a=document.createElement("a")

a.href=URL.createObjectURL(blob)
a.download=name

document.body.appendChild(a)
a.click()
document.body.removeChild(a)

}

let startX=0

document.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX
})

document.addEventListener("touchend",e=>{

let endX=e.changedTouches[0].clientX

if(startX-endX>80)nextPage()
if(endX-startX>80)prevPage()

})

let lastDist=0

document.addEventListener("touchmove",e=>{

if(e.touches.length==2){

const dx=e.touches[0].clientX-e.touches[1].clientX
const dy=e.touches[0].clientY-e.touches[1].clientY
const dist=Math.sqrt(dx*dx+dy*dy)

if(lastDist){

if(dist>lastDist)zoom(.05)
else zoom(-.05)

}

lastDist=dist

}

})

document.addEventListener("touchend",()=>lastDist=0)

function zoom(d){
scale=Math.max(.4,Math.min(3,scale+d))
renderPage(currentPage)
}

</script>
</body>
</html>
