<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Technical Analysis Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        select, button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 1em;
            cursor: pointer;
            background: #1e293b;
            color: white;
        }
        
        select {
            background: #1e293b;
            cursor: pointer;
        }
        
        button {
            background: #3b82f6;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #2563eb;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .card h3 {
            margin-bottom: 15px;
            color: #1e293b;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
        }
        
        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .indicator-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        
        .indicator-label {
            font-size: 0.85em;
            color: #64748b;
            margin-bottom: 8px;
        }
        
        .indicator-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .signal-bullish {
            color: #10b981;
        }
        
        .signal-bearish {
            color: #ef4444;
        }
        
        .signal-neutral {
            color: #f59e0b;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 15px;
        }
        
        .signal-strength {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: #f1f5f9;
        }
        
        .strength-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .strength-fill {
            height: 100%;
            transition: width 0.3s;
        }
        
        .recommendation {
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .update-time {
            color: #94a3b8;
            font-size: 0.85em;
            text-align: right;
            margin-top: 20px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 Forex Technical Analysis Dashboard</h1>
        
        <div class="controls">
            <select id="pairSelect">
                <option value="EUR">EUR/USD</option>
                <option value="GBP">GBP/USD</option>
                <option value="JPY">USD/JPY</option>
                <option value="CHF">USD/CHF</option>
                <option value="CAD">USD/CAD</option>
                <option value="AUD">AUD/USD</option>
            </select>
            <select id="periodSelect">
                <option value="7">7 Days</option>
                <option value="14">14 Days</option>
                <option value="30" selected>30 Days</option>
                <option value="60">60 Days</option>
            </select>
            <button onclick="refreshData()">🔄 Refresh Data</button>
        </div>
        
        <div class="dashboard" id="dashboard">
            <div class="card">
                <h3>📊 Price Action & Moving Averages</h3>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
            
            <div class="card">
                <h3>📈 Technical Indicators</h3>
                <div class="indicators-grid" id="indicatorsGrid">
                    Loading...
                </div>
            </div>
            
            <div class="card">
                <h3>🎯 Trading Signals</h3>
                <div id="tradingSignals">
                    Loading...
                </div>
            </div>
            
            <div class="card">
                <h3>📉 Momentum & Oscillators</h3>
                <div id="momentumIndicators">
                    Loading...
                </div>
            </div>
        </div>
        
        <div class="update-time" id="updateTime"></div>
    </div>

    <script>
        let priceChart = null;
        let historicalData = [];
        
        // Fetch historical data from Frankfurter
        async function fetchHistoricalData(base, target, days) {
            try {
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(startDate.getDate() - days);
                
                const startStr = startDate.toISOString().split('T')[0];
                const endStr = endDate.toISOString().split('T')[0];
                
                const url = `https://api.frankfurter.app/${startStr}..${endStr}?from=${base}&to=${target}`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error('Failed to fetch historical data');
                
                const data = await response.json();
                
                // Convert to array format
                const prices = [];
                for (const [date, rates] of Object.entries(data.rates)) {
                    prices.push({
                        date: new Date(date),
                        price: rates[target]
                    });
                }
                
                return prices.sort((a, b) => a.date - b.date);
            } catch (error) {
                console.error('Error fetching historical data:', error);
                return [];
            }
        }
        
        // Calculate Simple Moving Average
        function calculateSMA(data, period) {
            const sma = [];
            for (let i = period - 1; i < data.length; i++) {
                const sum = data.slice(i - period + 1, i + 1).reduce((acc, val) => acc + val.price, 0);
                sma.push({
                    date: data[i].date,
                    value: sum / period
                });
            }
            return sma;
        }
        
        // Calculate Exponential Moving Average
        function calculateEMA(data, period) {
            const multiplier = 2 / (period + 1);
            const ema = [];
            
            // Start with SMA for first value
            let firstSum = data.slice(0, period).reduce((acc, val) => acc + val.price, 0);
            let prevEMA = firstSum / period;
            ema.push({ date: data[period - 1].date, value: prevEMA });
            
            // Calculate EMA for remaining points
            for (let i = period; i < data.length; i++) {
                const currentEMA = (data[i].price - prevEMA) * multiplier + prevEMA;
                ema.push({ date: data[i].date, value: currentEMA });
                prevEMA = currentEMA;
            }
            
            return ema;
        }
        
        // Calculate Relative Strength Index (RSI)
        function calculateRSI(data, period = 14) {
            const gains = [];
            const losses = [];
            
            // Calculate price changes
            for (let i = 1; i < data.length; i++) {
                const change = data[i].price - data[i-1].price;
                gains.push(Math.max(change, 0));
                losses.push(Math.max(-change, 0));
            }
            
            const rsi = [];
            
            for (let i = period - 1; i < gains.length; i++) {
                const avgGain = gains.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
                const avgLoss = losses.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
                
                if (avgLoss === 0) {
                    rsi.push({ date: data[i + 1].date, value: 100 });
                } else {
                    const rs = avgGain / avgLoss;
                    const rsiValue = 100 - (100 / (1 + rs));
                    rsi.push({ date: data[i + 1].date, value: rsiValue });
                }
            }
            
            return rsi;
        }
        
        // Calculate Bollinger Bands
        function calculateBollingerBands(data, period = 20, stdDev = 2) {
            const bands = [];
            
            for (let i = period - 1; i < data.length; i++) {
                const slice = data.slice(i - period + 1, i + 1);
                const prices = slice.map(d => d.price);
                const sma = prices.reduce((a, b) => a + b, 0) / period;
                
                const variance = prices.reduce((acc, price) => acc + Math.pow(price - sma, 2), 0) / period;
                const std = Math.sqrt(variance);
                
                bands.push({
                    date: data[i].date,
                    middle: sma,
                    upper: sma + (stdDev * std),
                    lower: sma - (stdDev * std)
                });
            }
            
            return bands;
        }
        
        // Calculate MACD (Moving Average Convergence Divergence)
        function calculateMACD(data, fastPeriod = 12, slowPeriod = 26, signalPeriod = 9) {
            const emaFast = calculateEMA(data, fastPeriod);
            const emaSlow = calculateEMA(data, slowPeriod);
            
            // Align data
            const macdLine = [];
            const minLength = Math.min(emaFast.length, emaSlow.length);
            
            for (let i = 0; i < minLength; i++) {
                macdLine.push({
                    date: emaFast[i].date,
                    value: emaFast[i].value - emaSlow[i].value
                });
            }
            
            // Calculate signal line (EMA of MACD)
            const signalLine = calculateEMA(macdLine, signalPeriod);
            
            // Calculate histogram
            const histogram = [];
            for (let i = 0; i < signalLine.length; i++) {
                const macdValue = macdLine.find(m => m.date.getTime() === signalLine[i].date.getTime());
                if (macdValue) {
                    histogram.push({
                        date: signalLine[i].date,
                        value: macdValue.value - signalLine[i].value
                    });
                }
            }
            
            return { macdLine, signalLine, histogram };
        }
        
        // Calculate Stochastic Oscillator
        function calculateStochastic(data, period = 14) {
            const stochastic = [];
            
            for (let i = period - 1; i < data.length; i++) {
                const slice = data.slice(i - period + 1, i + 1);
                const high = Math.max(...slice.map(d => d.price));
                const low = Math.min(...slice.map(d => d.price));
                const currentClose = data[i].price;
                
                const k = ((currentClose - low) / (high - low)) * 100;
                stochastic.push({ date: data[i].date, value: k });
            }
            
            // Calculate %D (3-period SMA of %K)
            const d = [];
            for (let i = 2; i < stochastic.length; i++) {
                const avg = (stochastic[i-2].value + stochastic[i-1].value + stochastic[i].value) / 3;
                d.push({ date: stochastic[i].date, value: avg });
            }
            
            return { k: stochastic, d };
        }
        
        // Calculate Average True Range (ATR) for volatility
        function calculateATR(data, period = 14) {
            const trueRanges = [];
            
            for (let i = 1; i < data.length; i++) {
                // Since we only have close prices, we'll use price change as proxy
                const highLow = Math.abs(data[i].price - data[i-1].price);
                trueRanges.push(highLow);
            }
            
            const atr = [];
            for (let i = period - 1; i < trueRanges.length; i++) {
                const avg = trueRanges.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
                atr.push({ date: data[i + 1].date, value: avg });
            }
            
            return atr;
        }
        
        // Generate trading recommendation based on all indicators
        function generateRecommendation(currentPrice, sma20, sma50, rsi, macd, stochastic, bands) {
            let bullishSignals = 0;
            let bearishSignals = 0;
            let signals = [];
            
            // Moving Average crossover
            if (sma20 > sma50) {
                bullishSignals++;
                signals.push("✅ Golden Cross (20MA > 50MA)");
            } else if (sma20 < sma50) {
                bearishSignals++;
                signals.push("❌ Death Cross (20MA < 50MA)");
            }
            
            // RSI signals
            if (rsi < 30) {
                bullishSignals++;
                signals.push("✅ Oversold (RSI < 30) - Buy Signal");
            } else if (rsi > 70) {
                bearishSignals++;
                signals.push("❌ Overbought (RSI > 70) - Sell Signal");
            }
            
            // MACD signals
            if (macd > 0) {
                bullishSignals++;
                signals.push("✅ Bullish MACD");
            } else if (macd < 0) {
                bearishSignals++;
                signals.push("❌ Bearish MACD");
            }
            
            // Stochastic signals
            if (stochastic < 20) {
                bullishSignals++;
                signals.push("✅ Oversold Stochastic");
            } else if (stochastic > 80) {
                bearishSignals++;
                signals.push("❌ Overbought Stochastic");
            }
            
            // Bollinger Bands signals
            if (currentPrice < bands.lower) {
                bullishSignals++;
                signals.push("✅ Price below lower band - Oversold");
            } else if (currentPrice > bands.upper) {
                bearishSignals++;
                signals.push("❌ Price above upper band - Overbought");
            }
            
            const totalSignals = bullishSignals + bearishSignals;
            const strength = totalSignals > 0 ? (bullishSignals / totalSignals) * 100 : 50;
            
            let recommendation = "";
            let action = "";
            let color = "";
            
            if (strength >= 70) {
                recommendation = "STRONG BUY";
                action = "Consider LONG position";
                color = "#10b981";
            } else if (strength >= 55) {
                recommendation = "BUY";
                action = "Bullish bias";
                color = "#34d399";
            } else if (strength <= 30) {
                recommendation = "STRONG SELL";
                action = "Consider SHORT position";
                color = "#ef4444";
            } else if (strength <= 45) {
                recommendation = "SELL";
                action = "Bearish bias";
                color = "#f87171";
            } else {
                recommendation = "NEUTRAL";
                action = "Wait for clearer signals";
                color = "#f59e0b";
            }
            
            return { recommendation, action, strength, signals, color };
        }
        
        // Update UI with all indicators
        async function refreshData() {
            const pair = document.getElementById('pairSelect').value;
            const days = parseInt(document.getElementById('periodSelect').value);
            const base = pair === 'AUD' ? 'AUD' : 'USD';
            const target = pair === 'AUD' ? 'USD' : pair;
            
            // Show loading
            document.getElementById('indicatorsGrid').innerHTML = '<div class="indicator-box">Loading indicators...</div>';
            document.getElementById('tradingSignals').innerHTML = 'Loading signals...';
            document.getElementById('momentumIndicators').innerHTML = 'Loading momentum data...';
            
            // Fetch data
            historicalData = await fetchHistoricalData(base, target, days);
            
            if (historicalData.length === 0) {
                document.getElementById('indicatorsGrid').innerHTML = '<div class="indicator-box">Error loading data. Please try again.</div>';
                return;
            }
            
            const prices = historicalData.map(d => d.price);
            const currentPrice = prices[prices.length - 1];
            
            // Calculate indicators
            const sma20 = calculateSMA(historicalData, 20);
            const sma50 = calculateSMA(historicalData, 50);
            const ema12 = calculateEMA(historicalData, 12);
            const ema26 = calculateEMA(historicalData, 26);
            const rsi = calculateRSI(historicalData, 14);
            const macd = calculateMACD(historicalData, 12, 26, 9);
            const stochastic = calculateStochastic(historicalData, 14);
            const bands = calculateBollingerBands(historicalData, 20, 2);
            const atr = calculateATR(historicalData, 14);
            
            // Get latest values
            const currentSMA20 = sma20[sma20.length - 1]?.value || currentPrice;
            const currentSMA50 = sma50[sma50.length - 1]?.value || currentPrice;
            const currentRSI = rsi[rsi.length - 1]?.value || 50;
            const currentMACD = macd.macdLine[macd.macdLine.length - 1]?.value || 0;
            const currentStochastic = stochastic.k[stochastic.k.length - 1]?.value || 50;
            const currentBands = bands[bands.length - 1] || { upper: currentPrice, lower: currentPrice };
            const currentATR = atr[atr.length - 1]?.value || 0;
            
            // Update indicators grid
            document.getElementById('indicatorsGrid').innerHTML = `
                <div class="indicator-box">
                    <div class="indicator-label">RSI (14)</div>
                    <div class="indicator-value ${currentRSI > 70 ? 'signal-bearish' : currentRSI < 30 ? 'signal-bullish' : ''}">
                        ${currentRSI.toFixed(2)}
                    </div>
                    <div style="font-size: 0.8em;">${currentRSI > 70 ? 'Overbought' : currentRSI < 30 ? 'Oversold' : 'Neutral'}</div>
                </div>
                <div class="indicator-box">
                    <div class="indicator-label">MACD</div>
                    <div class="indicator-value ${currentMACD > 0 ? 'signal-bullish' : 'signal-bearish'}">
                        ${currentMACD.toFixed(4)}
                    </div>
                    <div style="font-size: 0.8em;">${currentMACD > 0 ? 'Bullish' : 'Bearish'}</div>
                </div>
                <div class="indicator-box">
                    <div class="indicator-label">Stochastic %K</div>
                    <div class="indicator-value ${currentStochastic > 80 ? 'signal-bearish' : currentStochastic < 20 ? 'signal-bullish' : ''}">
                        ${currentStochastic.toFixed(2)}
                    </div>
                    <div style="font-size: 0.8em;">${currentStochastic > 80 ? 'Overbought' : currentStochastic < 20 ? 'Oversold' : 'Neutral'}</div>
                </div>
                <div class="indicator-box">
                    <div class="indicator-label">ATR (Volatility)</div>
                    <div class="indicator-value">
                        ${currentATR.toFixed(4)}
                    </div>
                    <div style="font-size: 0.8em;">${currentATR > 0.01 ? 'High' : 'Low'} volatility</div>
                </div>
            `;
            
            // Generate trading recommendation
            const recommendation = generateRecommendation(
                currentPrice, currentSMA20, currentSMA50, currentRSI, 
                currentMACD, currentStochastic, currentBands
            );
            
            document.getElementById('tradingSignals').innerHTML = `
                <div class="signal-strength">
                    <div><strong>Overall Signal Strength</strong></div>
                    <div class="strength-bar">
                        <div class="strength-fill" style="width: ${recommendation.strength}%; background: ${recommendation.color};"></div>
                    </div>
                    <div class="recommendation" style="background: ${recommendation.color}20; color: ${recommendation.color};">
                        <strong>${recommendation.recommendation}</strong><br>
                        ${recommendation.action}
                    </div>
                    <div style="margin-top: 15px;">
                        <strong>Signals:</strong>
                        <ul style="margin-top: 10px; margin-left: 20px;">
                            ${recommendation.signals.map(s => `<li>${s}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
            
            // Update momentum indicators
            const sma20Value = currentSMA20;
            const sma50Value = currentSMA50;
            const emaValue = ema12[ema12.length - 1]?.value || currentPrice;
            
            document.getElementById('momentumIndicators').innerHTML = `
                <div class="indicators-grid">
                    <div class="indicator-box">
                        <div class="indicator-label">SMA (20)</div>
                        <div class="indicator-value">${sma20Value.toFixed(4)}</div>
                    </div>
                    <div class="indicator-box">
                        <div class="indicator-label">SMA (50)</div>
                        <div class="indicator-value">${sma50Value.toFixed(4)}</div>
                    </div>
                    <div class="indicator-box">
                        <div class="indicator-label">EMA (12)</div>
                        <div class="indicator-value">${emaValue.toFixed(4)}</div>
                    </div>
                    <div class="indicator-box">
                        <div class="indicator-label">Bollinger Bands</div>
                        <div class="indicator-value" style="font-size: 0.9em;">
                            Upper: ${currentBands.upper.toFixed(4)}<br>
                            Middle: ${currentBands.middle.toFixed(4)}<br>
                            Lower: ${currentBands.lower.toFixed(4)}
                        </div>
                    </div>
                </div>
            `;
            
            // Update chart
            updateChart(historicalData, sma20, sma50, bands);
            
            // Update time
            document.getElementById('updateTime').innerHTML = `Last updated: ${new Date().toLocaleString()}`;
        }
        
        // Update Chart.js chart
        function updateChart(data, sma20, sma50, bands) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            const dates = data.map(d => d.date.toLocaleDateString());
            const prices = data.map(d => d.price);
            
            const sma20Data = Array(data.length - sma20.length).fill(null).concat(sma20.map(s => s.value));
            const sma50Data = Array(data.length - sma50.length).fill(null).concat(sma50.map(s => s.value));
            const upperBandData = Array(data.length - bands.length).fill(null).concat(bands.map(b => b.upper));
            const lowerBandData = Array(data.length - bands.length).fill(null).concat(bands.map(b => b.lower));
            
            if (priceChart) {
                priceChart.destroy();
            }
            
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'Price',
                            data: prices,
                            borderColor: '#3b82f6',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            tension: 0.1
                        },
                        {
                            label: 'SMA 20',
                            data: sma20Data,
                            borderColor: '#10b981',
                            backgroundColor: 'transparent',
                            borderWidth: 1.5,
                            borderDash: [5, 5],
                            tension: 0.1
                        },
                        {
                            label: 'SMA 50',
                            data: sma50Data,
                            borderColor: '#f59e0b',
                            backgroundColor: 'transparent',
                            borderWidth: 1.5,
                            borderDash: [5, 5],
                            tension: 0.1
                        },
                        {
                            label: 'Upper Band',
                            data: upperBandData,
                            borderColor: '#94a3b8',
                            backgroundColor: 'transparent',
                            borderWidth: 1,
                            borderDash: [2, 2],
                            tension: 0.1
                        },
                        {
                            label: 'Lower Band',
                            data: lowerBandData,
                            borderColor: '#94a3b8',
                            backgroundColor: 'transparent',
                            borderWidth: 1,
                            borderDash: [2, 2],
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        },
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Price'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }
        
        // Initial load
        refreshData();
        
        // Auto-refresh every minute
        setInterval(refreshData, 60000);
    </script>
</body>
</html>
